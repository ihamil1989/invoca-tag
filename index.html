<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoca Tag testing</title>
    <style>
        .lead-form-box {
            max-width: 400px;
            margin: 30px 0;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-family: Arial, sans-serif;
        }
        .form-field {
            margin-bottom: 15px;
        }
        .form-field label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-field input[type="text"], 
        .form-field input[type="email"], 
        .form-field input[type="tel"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        .consent-field {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 15px;
        }
        .submit-btn {
            background-color: #0076d6;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .submit-btn:disabled {
            background-color: #aaa;
        }
        #statusMessage {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <br><br>
    
    <h3>Commercial Sales</h3>
    <a href="tel:+18166514477" class="invoca" data-locator_type="Commercial">816-651-4477</a>

    <br><br>

    <div class="lead-form-box">
        <h3>Lead Capture Form</h3>
        <form id="leadForm">
            <input type="hidden" name="invoca_attribution_id" id="invoca_attribution_id" value="" />

            <div class="form-field">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="John Doe" required>
            </div>

            <div class="form-field">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="john@example.com" required>
            </div>

            <div class="form-field">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="816-555-0199" required>
            </div>

            <div class="consent-field">
                <input type="checkbox" id="sms_consent" required>
                <label for="sms_consent">
                    I consent to receive automated qualification text messages from the AI Messaging Agent at the number provided.
                </label>
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">Submit to Workato</button>
            <div id="statusMessage"></div>
        </form>
    </div>

    <script>
        const WORKATO_WEBHOOK_URL = 'https://webhooks.workato.com/webhooks/rest/545fbf57-73dd-462b-94dc-4c9ca03705df/testing-again';

        document.getElementById('leadForm').addEventListener('submit', function(event) {
            event.preventDefault(); 

            const submitBtn = document.getElementById('submitBtn');
            const statusMessage = document.getElementById('statusMessage');
            
            submitBtn.disabled = true;
            submitBtn.innerText = 'Sending to Workato...';
            statusMessage.innerText = '';

            const payload = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                sms_consent: document.getElementById('sms_consent').checked,
                invoca_attribution_id: document.getElementById('invoca_attribution_id').value
            };

            fetch(WORKATO_WEBHOOK_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(response => {
                if (response.ok) {
                    statusMessage.style.color = 'green';
                    statusMessage.innerText = 'Success! Data passed to Workato.';
                    document.getElementById('leadForm').reset();
                } else {
                    throw new Error('Workato returned a bad response status.');
                }
            })
            .catch(error => {
                console.error('API Error:', error);
                statusMessage.style.color = 'red';
                statusMessage.innerText = 'Submission failed. Check console.';
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Submit to Workato';
            });
        });
    </script>

    <br><br>

    <script>
      (function(i,n,v,o,c,a) { i.InvocaTagId = o; var s = n.createElement('script'); s.type = 'text/javascript';
        s.async = true; s.src = ('https:' === n.location.protocol ? 'https://' : 'http://' ) + v;
        var fs = n.getElementsByTagName('script')[0]; fs.parentNode.insertBefore(s, fs);
      })(window, document, 'solutions.invocacdn.com/js/invoca-latest.min.js', '2967/1642819500');
    </script>
</body>
</html>
